<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ثبت نام</title>
    {% if message %}
    <ul class="message">
        {% for message in message %}
        <li
        {% if message.tage %} class="{{ message.tag }}" {% endif %}>
            {{ message }}
        </li>
        {% endfor %}
    </ul>
    {% endif %}
</head>
<body>

<form method="post" action="{% url 'account:signup' %}">
    {% csrf_token %}
    <label>
        <input type="text" name="username" placeholder="نام خود را وارد کنید ">
    </label>
    <label>
        <input type="password" name="pass1" placeholder="رمز عبور">
    </label>
    <label>
        <input type="password" name="pass2" placeholder="تکرار رمز عبور">
    </label>
    <button type="submit">ارسال فرم</button>
</form>

</body>
</html>
